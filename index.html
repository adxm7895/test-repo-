<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Pocket Tasks</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header class="masthead"><a href="./" aria-label="Pocket Tasks home">pocket<span> / tasks</span></a><span class="local-label">Stored on this device</span></header>
    <section class="intro" aria-labelledby="heading">
      <p class="eyebrow">A LITTLE ROOM TO FOCUS</p>
      <h1 id="heading">One thing<br>at a time.</h1>
      <p class="lede">Keep the important things close. Give the rest a little space.</p>
    </section>
    <section class="workspace" aria-label="Your tasks">
      <form id="task-form">
        <label for="task-input">What needs doing?</label>
        <div class="input-row"><input id="task-input" name="task" placeholder="Write your next small step…" maxlength="160" required autocomplete="off"><button class="primary" type="submit">Add task <span aria-hidden="true">↗</span></button></div>
      </form>
      <div class="list-toolbar">
        <div class="filters" role="group" aria-label="Filter tasks"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="active" aria-pressed="false">To do</button><button type="button" data-filter="done" aria-pressed="false">Done</button></div>
        <span id="count"></span>
      </div>
      <ul id="tasks" aria-label="Task list"></ul>
      <div id="empty"><span class="empty-mark" aria-hidden="true">＋</span><h2>A clear starting point.</h2><p>Add your first task above. Small steps count.</p></div>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="storage-error" role="alert" hidden></p>
    </section>
    <footer><span>Less noise. More done.</span><span>Local review · No account needed</span></footer>
  </main>
</body>
</html>
